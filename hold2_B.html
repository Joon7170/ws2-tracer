const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const msg=t=>document.getElementById('msg').textContent=t;
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},base,256));
}
async function openWith(raw){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},k,u8(P.c));
  const html=new TextDecoder().decode(pt);
  if(document.readyState!=='complete') await new Promise(r=>addEventListener('load',r,{once:true}));
  await new Promise(r=>setTimeout(r,0));
  document.open();document.write(html);document.close();
}
const b64=a=>btoa(String.fromCharCode(...a));
(async()=>{
  if(!window.crypto||!crypto.subtle){msg('이 브라우저에서는 열 수 없습니다 (https 주소로 열어 주세요).');return;}
  let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){try{await openWith(u8(saved));return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}
  document.getElementById('f').onsubmit=async ev=>{
    ev.preventDefault();msg('여는 중…');
    try{
      const raw=await derive(document.getElementById('pw').value);
      try{ if(document.getElementById('rm').checked) localStorage.setItem(KEY,b64(raw)); }catch(e){}
      await openWith(raw);
    }catch(e){msg('비밀번호가 맞지 않습니다.')}
  };
})();
</script></body></html>
