<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WS2 SEM 판독 결과</title>
<style>
:root { --bg:#f5f6f8; --card:#fff; --ink:#1c2330; --sub:#5b6577; --line:#dfe3ea; --accent:#1f5fbf; --accent-ink:#fff; --ok:#1e7d46; --warn:#a15c00; --bad:#b3261e; --soft:#eef2f8; }
* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 13px; }
button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
button:disabled { opacity:.5; cursor:default; }
input[type=text], input[type=password], select, textarea { border:1px solid var(--line); border-radius:8px; padding:7px 10px; background:#fff; min-width:0; }
header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:10px 18px; flex-wrap:wrap; }
header h1 { font-size:17px; margin:0; font-weight:700; }
header .sp { flex:1; }
header .who { color:var(--sub); font-size:13px; }
main { max-width:1280px; margin:0 auto; padding:18px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.muted { color:var(--sub); } .small { font-size:13px; }
.tablewrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { font-size:13px; color:var(--sub); font-weight:600; background:#fafbfc; position:sticky; top:0; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
tr.pick { cursor:pointer; } tr.pick:hover td { background:var(--soft); }
.tag { display:inline-block; border-radius:999px; padding:1px 9px; font-size:12.5px; border:1px solid var(--line); background:#fff; }
.tag.ok { color:var(--ok); border-color:#b9dcc7; background:#eff8f2; } .tag.warn { color:var(--warn); border-color:#ecd3a8; background:#fdf6e9; }
.tag.bad { color:var(--bad); border-color:#efc1bd; background:#fdf0ef; } .tag.wait { color:var(--sub); background:#f3f4f7; }
#login { max-width:440px; margin:8vh auto; } #login label { display:block; margin:12px 0 4px; font-size:13px; color:var(--sub); } #login input { width:100%; }
.err { color:var(--bad); min-height:1.4em; }
.grid2 { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); gap:16px; } @media (max-width:900px){ .grid2 { grid-template-columns:1fr; } }
.kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; } .kv dt { color:var(--sub); } .kv dd { margin:0; }
h2 { font-size:16px; margin:0 0 10px; } h3 { font-size:14px; margin:16px 0 6px; color:var(--sub); font-weight:600; }
.stat { display:flex; gap:10px; flex-wrap:wrap; } .stat > div { background:var(--soft); border-radius:10px; padding:8px 12px; min-width:92px; }
.stat b { display:block; font-size:19px; font-variant-numeric:tabular-nums; } .stat span { font-size:12.5px; color:var(--sub); }
img.fit { max-width:100%; height:auto; border-radius:8px; border:1px solid var(--line); display:block; }
dialog { border:1px solid var(--line); border-radius:14px; padding:20px; width:min(560px, 94vw); } dialog::backdrop { background:rgba(20,25,35,.45); }
dialog label { display:block; margin:10px 0 4px; font-size:13px; color:var(--sub); } dialog input[type=text], dialog select, dialog textarea { width:100%; }
#rv { position:fixed; inset:0; z-index:20; background:#fff; display:flex; flex-direction:column; } #rv[hidden] { display:none; }
#rv .bar { display:flex; gap:10px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; background:#fff; }
#rv iframe { flex:1; border:0; width:100%; }
#toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#1c2330; color:#fff; padding:9px 16px; border-radius:10px; z-index:40; max-width:90vw; } #toast[hidden] { display:none; }
.note { background:#fdf6e9; border:1px solid #ecd3a8; border-radius:10px; padding:10px 12px; }
.scrollbox { max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>WS2 SEM 판독 결과</h1>
  <span class="muted small" id="ver"></span>
  <span class="sp"></span>
  <span class="who" id="whoami"></span>
  <button id="btnList" hidden>목록</button>
  <button id="btnUpload" class="primary" hidden>사진 등록</button>
  <button id="btnLogout" hidden>나가기</button>
</header>

<main>
  <section id="login" class="card" hidden>
    <h2>들어가기</h2>
    <p class="muted small">연구실에서 받은 암호와 본인 이름을 넣으세요. 이름은 사진 등록·검토 기록에 남습니다.</p>
    <div id="apiRow"><label for="inApi">저장소 연결 주소</label><input id="inApi" type="text" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></div>
    <label for="inPw">암호</label><input id="inPw" type="password" autocomplete="current-password">
    <label for="inWho">이름</label><input id="inWho" type="text" autocomplete="name" maxlength="40">
    <p class="err" id="loginErr"></p>
    <button class="primary" id="btnLogin">들어가기</button>
  </section>

  <section id="list" hidden>
    <div class="card">
      <div class="row">
        <input id="q" type="text" placeholder="검색: 런 번호, 위치, 파일 이름, 등록한 사람" style="flex:1 1 260px">
        <select id="fStatus" aria-label="상태"><option value="">상태 전체</option><option value="registered">분석 대기</option><option value="needs_side">결정 쪽 선택 필요</option><option value="analyzed">분석 완료 · 검토 전</option><option value="reviewed">검토됨</option><option value="failed">분석 실패</option></select>
        <select id="fPre" aria-label="전구체"><option value="">전구체 전체</option><option value="H2S">H₂S</option><option value="DMS">DMS</option><option value="unknown">미확인</option></select>
        <button id="btnRefresh">새로 고침</button>
      </div>
      <p class="muted small" id="listInfo" style="margin:10px 0 6px"></p>
      <div class="tablewrap"><table id="tbl"><thead><tr>
        <th>런</th><th>위치</th><th class="num">배율</th><th>전구체</th><th>상태</th><th class="num">자동 판독 수</th><th class="num">사진 전체 S3</th><th class="num">검토 영역 S3</th><th>마지막 검토</th><th>파일</th><th>등록</th>
      </tr></thead><tbody></tbody></table></div>
    </div>
  </section>

  <section id="detail" hidden></section>
</main>

<dialog id="dlgUpload">
  <h2>SEM 사진 등록</h2>
  <p class="muted small">원본 그대로 올립니다(정보 띠 포함). 등록하면 분석 대기 상태가 되고, 계산 담당이 Colab의 "새 사진 분석"을 실행하면 결과가 붙습니다.</p>
  <label for="upFile">사진 파일 (jpg, tif, png · 여러 장 가능)</label><input id="upFile" type="file" accept=".jpg,.jpeg,.png,.tif,.tiff,image/*" multiple>
  <label for="upRun">런 번호 (비워 두면 파일 이름에서 읽음. 예: R237)</label><input id="upRun" type="text" maxlength="20">
  <label for="upPos">위치 (비워 두면 파일 이름에서 읽음. 예: P1)</label><input id="upPos" type="text" maxlength="30">
  <label for="upPre">전구체</label><select id="upPre"><option value="unknown">미확인</option><option value="H2S">H₂S</option><option value="DMS">DMS</option></select>
  <label for="upNote">메모 (선택)</label><input id="upNote" type="text" maxlength="200">
  <p class="err" id="upErr"></p><p class="small muted" id="upProg"></p>
  <div class="row" style="justify-content:flex-end"><button id="upCancel">닫기</button><button class="primary" id="upGo">등록</button></div>
</dialog>

<dialog id="dlgStart">
  <h2>어디에서 시작할까요?</h2>
  <div id="startOpts"></div>
  <div class="row" style="justify-content:flex-end; margin-top:14px"><button id="startCancel">취소</button></div>
</dialog>

<div id="rv" hidden>
  <div class="bar">
    <b id="rvTitle"></b><span class="muted small" id="rvFrom"></span><span class="sp" style="flex:1"></span>
    <span class="small" id="rvMsg"></span>
    <button class="primary" id="rvSave">저장 (새 판으로)</button><button id="rvClose">닫기</button>
  </div>
  <iframe id="rvFrame" title="검토 화면"></iframe>
</div>
<div id="toast" hidden></div>

<script>
/* ============================== settings ==============================
   Put the storage-link address (Apps Script web app URL) here once it exists; while it is empty the page asks for it. */
const API_URL_FIXED = '';
const APP_VERSION = 'sem web 0.1';

/* ============================== small helpers ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k){ try { return localStorage.getItem(k); } catch (e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e){} }, del(k){ try { localStorage.removeItem(k); } catch (e){} } };
const SS = { get(k){ try { return sessionStorage.getItem(k); } catch (e){ return null; } }, set(k, v){ try { sessionStorage.setItem(k, v); } catch (e){} }, del(k){ try { sessionStorage.removeItem(k); } catch (e){} } };
let toastTimer = 0;
function toast(t, ms){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms || 3500); }
const fmt = (v, d) => v == null || Number.isNaN(v) ? '–' : Number(v).toFixed(d == null ? 3 : d);
const when = t => { if (!t) return ''; const d = new Date(t); if (isNaN(d)) return String(t); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function lkey(n){ let h = 2166136261; for (const ch of String(n).toLowerCase()) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16).padStart(8, '0'); }   // same as the review page
const PRE_KO = {H2S: 'H₂S', DMS: 'DMS', unknown: '미확인'};
const STATUS = { registered: ['분석 대기', 'wait'], reread_requested: ['다시 판독 대기', 'wait'], needs_side: ['결정 쪽 선택 필요', 'warn'], analyzed: ['분석 완료 · 검토 전', ''], reviewed: ['검토됨', 'ok'], failed: ['분석 실패', 'bad'] };
const SIDE_KO = {auto: '자동', dark: '어두운 쪽이 결정', bright: '밝은 쪽이 결정', off: '적용 안 함'};
const STATE_KO = {confirmed: '확인 완료', partial: '부분 검토', not_reviewed: '미검토'};
const HOLD_KO = {border: '사진 끝에 닿음', small: '작음', round: '둥긂', 'merged-shape': '붙은 모양', background: '바탕(결정 사이 빈 곳)'};
const statusTag = s => { const v = STATUS[s] || [s, '']; return `<span class="tag ${v[1]}">${esc(v[0])}</span>`; };

/* ============================== storage link ============================== */
let API = API_URL_FIXED || LS.get('ws2sem.api') || '', PW = SS.get('ws2sem.pw') || '', WHO = LS.get('ws2sem.who') || '';
async function api(action, params){
  let res;
  try { res = await fetch(API, {method: 'POST', redirect: 'follow', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({password: PW, action}, params || {}))}); }
  catch (e){ throw new Error('저장소에 연결하지 못했습니다. 인터넷 연결과 연결 주소를 확인하세요.'); }
  let j; try { j = await res.json(); } catch (e){ throw new Error('저장소의 답을 읽지 못했습니다 (연결 주소가 맞는지 확인하세요).'); }
  if (!j.ok){ if (j.error === 'password'){ const e = new Error('암호가 맞지 않습니다.'); e.code = 'password'; throw e; } throw new Error(j.error || '알 수 없는 오류'); }
  return j;
}
const fileText = async (id, path) => (await api('file', {photo_id: id, path, as: 'text'})).text;
const fileUrl = async (id, path) => { const r = await api('file', {photo_id: id, path}); return `data:${r.mime || 'image/jpeg'};base64,${r.b64}`; };

/* ============================== review arithmetic ==============================
   The same rules as ws2read.review.apply_review / core.alignment (Python).  Colab recomputes every saved review in Python
   and records whether the two agree. */
const SINGLE = new Set(['iso', 'touch', 'round']);
function norm(x){
  if (typeof x === 'boolean' || x == null) return !!x;
  if (typeof x === 'number') return Math.round(x * 1000) / 1000;
  if (Array.isArray(x)) return x.map(norm);
  if (typeof x === 'object'){ const o = {}; Object.keys(x).sort().forEach(k => { if (k !== 't') o[k] = norm(x[k]); }); return o; }
  return x;
}
const sameN = (a, b) => JSON.stringify(norm(a)) === JSON.stringify(norm(b));
const changedFields = (p, q) => ['tag', 'v', 'nodir', 'u', 'cut', 'dirs', 'pts'].filter(k => !sameN(p[k], q[k]));
const mod = (x, m) => ((x % m) + m) % m, deg = r => r * 180 / Math.PI, r2 = x => Math.round(x * 100) / 100, r4 = x => Math.round(x * 10000) / 10000;
const centre = pts => [pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length];
const inBox = (x, y, b) => b[0] <= x && x < b[0] + b[2] && b[1] <= y && y < b[1] + b[3];
function vertexDir(pts, v){ const c = centre(pts); return mod(deg(Math.atan2(-(v[1] - c[1]), v[0] - c[0])), 120); }
function markDir(d){ const ua = [d.a[0] - d.v[0], d.a[1] - d.v[1]], ub = [d.b[0] - d.v[0], d.b[1] - d.v[1]]; const na = Math.hypot(ua[0], ua[1]) || 1, nb = Math.hypot(ub[0], ub[1]) || 1;
  const w = [ua[0] / na + ub[0] / nb, ua[1] / na + ub[1] / nb]; return mod(deg(Math.atan2(w[1], -w[0])), 120); }
function alignment(theta, k){ const n = theta.length; if (n < 2) return {n, raw: null, S: null};
  let re = 0, im = 0; theta.forEach(t => { const a = k * t * Math.PI / 180; re += Math.cos(a); im += Math.sin(a); }); re /= n; im /= n; const S = Math.hypot(re, im);
  return {n, raw: r4(S), S: r4(Math.sqrt(Math.max(S * S - 1 / n, 0) / (1 - 1 / n)))}; }
function reviewState(d, preDoc){ const ck = d.checks || {}, unread = ['unreadable', 'none', 'notread'].includes(d.status);
  if (d.done && (unread || (ck.auto && ck.missing))) return 'confirmed';
  const pre = {}, now = {}; preDoc.polys.forEach(p => { pre[p.id] = p; }); d.polys.forEach(p => { now[p.id] = p; });
  const touched = Object.keys(now).some(i => !(i in pre) || changedFields(now[i], pre[i]).length) || Object.keys(pre).some(i => !(i in now)) || ck.auto || ck.missing || d.status;
  return touched ? 'partial' : 'not_reviewed'; }
function computeResult(payload, preDoc){
  const d = (payload.docs || []).find(x => x.box === preDoc.box); if (!d) throw new Error('검토 내용에 이 사진의 상자가 없습니다.');
  const box = preDoc.box_xywh, pre = {}; preDoc.polys.forEach(p => { pre[p.id] = p; }); const now = {}; d.polys.forEach(p => { now[p.id] = p; });
  const th = []; let single = 0, marks = 0, kept = 0, changed = 0, added = 0;
  d.polys.forEach(p => { const q = pre[p.id]; const ch = q ? changedFields(p, q) : null;
    if (!q) added++; else if (ch.length) changed++; else kept++;
    const c = centre(p.pts), cin = inBox(c[0], c[1], box);
    if (SINGLE.has(p.tag) && p.v && !p.nodir && cin){ const a0 = q ? q.auto_theta : null; const vauto = !!q && sameN(q.v, p.v);
      th.push(r2((vauto && a0 != null) ? a0 : vertexDir(p.pts, p.v))); single++; }
    (p.dirs || []).forEach(m => { if (inBox(m.v[0], m.v[1], box)){ th.push(r2(markDir(m))); marks++; } }); });
  const a3 = alignment(th, 3), a6 = alignment(th, 6); const before = preDoc.polys.filter(p => p.auto_theta != null).map(p => p.auto_theta); const b3 = alignment(before, 3), b6 = alignment(before, 6);
  return {n: a3.n, S3: a3.S, S6: a6.S, S3_raw: a3.raw, S6_raw: a6.raw, single, clump_marks: marks, review_state: reviewState(d, preDoc), box_xywh: box, box_done: !!d.done,
          before: {n: b3.n, S3: b3.S, S6: b6.S}, changes: {program_outlines: preDoc.polys.length, kept_untouched: kept, changed, deleted: Object.keys(pre).filter(i => !(i in now)).length, added}, computed_by: APP_VERSION};
}

/* ============================== views ============================== */
let INDEX = null, CUR = null;
function show(id){ ['#login', '#list', '#detail'].forEach(s => { $(s).hidden = s !== id; }); const inside = id !== '#login';
  ['#btnUpload', '#btnLogout'].forEach(s => { $(s).hidden = !inside; }); $('#btnList').hidden = id !== '#detail'; $('#whoami').textContent = inside ? WHO : ''; }
function showLogin(msg){ $('#apiRow').hidden = !!API_URL_FIXED; $('#inApi').value = API; $('#inWho').value = WHO; $('#loginErr').textContent = msg || ''; show('#login'); ($('#inPw')).focus(); }
async function doLogin(){
  if (!API_URL_FIXED) API = $('#inApi').value.trim(); PW = $('#inPw').value; WHO = $('#inWho').value.trim().slice(0, 40);
  if (!API){ $('#loginErr').textContent = '저장소 연결 주소를 넣으세요.'; return; } if (!WHO){ $('#loginErr').textContent = '이름을 넣으세요.'; return; }
  $('#btnLogin').disabled = true; $('#loginErr').textContent = '확인 중…';
  try { const r = await api('ping'); LS.set('ws2sem.api', API); LS.set('ws2sem.who', WHO); SS.set('ws2sem.pw', PW); $('#ver').textContent = `${APP_VERSION} · 저장소 ${r.version}`; await loadList(); }
  catch (e){ $('#loginErr').textContent = e.message; }
  $('#btnLogin').disabled = false;
}
async function loadList(){ show('#list'); $('#listInfo').textContent = '불러오는 중…'; try { INDEX = (await api('list')).index; renderList(); } catch (e){ if (e.code === 'password') return showLogin(e.message); $('#listInfo').textContent = e.message; } }
function renderList(){
  const q = $('#q').value.trim().toLowerCase(), fs = $('#fStatus').value, fp = $('#fPre').value;
  let rows = Object.values((INDEX && INDEX.photos) || {});
  rows = rows.filter(r => (!fs || r.status === fs || (fs === 'registered' && r.status === 'reread_requested')) && (!fp || r.precursor === fp) &&
    (!q || [r.run, r.position, r.file, r.uploader, r.photo_id, r.note].some(v => String(v || '').toLowerCase().includes(q))));
  rows.sort((a, b) => String(a.run).localeCompare(String(b.run)) || String(a.position).localeCompare(String(b.position)) || (a.magnification || 0) - (b.magnification || 0));
  const total = Object.keys((INDEX && INDEX.photos) || {}).length;
  $('#listInfo').textContent = total ? `사진 ${total}장 중 ${rows.length}장 표시` : '아직 등록된 사진이 없습니다. 오른쪽 위 "사진 등록"으로 시작하세요.';
  $('#tbl tbody').innerHTML = rows.map(r => { const a = r.auto, v = r.review;
    return `<tr class="pick" data-id="${esc(r.photo_id)}"><td><b>${esc(r.run || '–')}</b></td><td>${esc(r.position || '–')}</td><td class="num">${r.magnification ? Number(r.magnification).toLocaleString() : '–'}</td><td>${esc(PRE_KO[r.precursor] || r.precursor)}</td>
      <td>${statusTag(r.status)}</td><td class="num">${a ? a.whole.read : '–'}</td><td class="num">${a ? fmt(a.whole.S3) : '–'}</td><td class="num">${v ? fmt(v.S3) : '–'}</td>
      <td>${v ? esc(v.who) + ' · ' + esc(when(v.at)) : '–'}</td><td class="muted small">${esc(r.file)}</td><td class="muted small">${esc(r.uploader || '')} ${esc(when(r.registered_at))}</td></tr>`; }).join('');
}
$('#tbl tbody').addEventListener('click', e => { const tr = e.target.closest('tr.pick'); if (tr) openDetail(tr.dataset.id); });

/* ----- detail ----- */
function currentAuto(m){ const A = m.auto || []; if (!A.length) return null; return A.find(x => x.k === m.auto_current) || A[A.length - 1]; }
async function openDetail(id){

function parseCsv(t){ const rows = []; let row = [], cur = '', q = false; for (let i = 0; i < t.length; i++){ const c = t[i];
    if (q){ if (c === '"'){ if (t[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ','){ row.push(cur); cur = ''; } else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; } else if (c !== '\r') cur += c; }
  if (cur || row.length){ row.push(cur); rows.push(row); } return rows; }

function parseName(b){ const r = /(R\d{3})/.exec(b), stem = b.replace(/\.[^.]+$/, ''), p = /_(P[A-Za-z0-9.(),-]+?)(?:_|$)/.exec(stem); return {run: r ? r[1] : '', position: p ? p[1] : ''}; }
async function sha16(buf){ const h = new Uint8Array(await crypto.subtle.digest('SHA-256', buf)); return Array.from(h.slice(0, 8)).map(x => x.toString(16).padStart(2, '0')).join(''); }
function toB64(buf){ const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
